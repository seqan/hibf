[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "hibf"
dynamic = ["version"]
description = "Python bindings for the Hierarchical Interleaved Bloom Filter (HIBF)"
readme = "python/README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [{ name = "SeqAn Team" }]
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/seqan/hibf"
Documentation = "https://docs.seqan.de/hibf"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
build-dir = "build/python/{wheel_tag}"
# The stable ABI requires Python >= 3.12. Older Pythons get version-specific wheels.
wheel.py-api = "cp312"
wheel.packages = ["python/hibf"]
sdist.exclude = ["/doc", "/util", "/test", "/build", "/.github"]
# configuration.cmake includes a script from test/cmake.
sdist.include = ["/test/cmake/hibf_require_ccache.cmake"]

[tool.scikit-build.cmake.define]
HIBF_PYTHON_BINDINGS = "ON"
INSTALL_HIBF = "OFF"
# Modules are only used with HIBF_MODULE=ON. Scanning adds -fmodules-ts, which ccache cannot cache.
CMAKE_CXX_SCAN_FOR_MODULES = "OFF"
# The library is optimised for the building machine (-march=native) by default.
# For portable wheels, pass: -C cmake.define.HIBF_NATIVE_BUILD=OFF

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/hibf/version.hpp"
regex = '''(?sx)
\#define \s+ HIBF_VERSION_MAJOR \s+ (?P<major>\d+) .*?
\#define \s+ HIBF_VERSION_MINOR \s+ (?P<minor>\d+) .*?
\#define \s+ HIBF_VERSION_PATCH \s+ (?P<patch>\d+) .*?
\#define \s+ HIBF_RELEASE_CANDIDATE \s+ (?P<rc>\d+)
'''
result = "{major}.{minor}.{patch}rc{rc}"
remove = "rc0$"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
