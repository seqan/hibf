name: Python

on:
  push:
    branches:
      - 'main'
  pull_request:
    types:
      - unlabeled
  workflow_dispatch:

concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  TZ: Europe/Berlin
  VENV: /tmp/venv

defaults:
  run:
    shell: bash -Eexuo pipefail {0}

jobs:
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.compiler }}
    if: github.repository_owner == 'seqan' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'lint'
    strategy:
      fail-fast: false
      matrix:
        compiler: ["clang-latest", "gcc-latest"]
    container:
      image: ghcr.io/seqan/${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup cache
        uses: seqan/actions/setup-actions-cache@main

      - name: Install Python
        run: |
          apt-get update 1>/dev/null
          apt-get install --yes --no-install-recommends \
            python3-dev \
            python3-venv \
            1>/dev/null
          python3 -m venv "${VENV}"

      - name: Build bindings
        run: |
          ccache -z
          "${VENV}/bin/pip" install --verbose ".[test]"
          ccache -sv

      - name: Run tests
        run: |
          "${VENV}/bin/pytest" -v

  sdist:
    runs-on: ubuntu-latest
    name: sdist
    if: github.repository_owner == 'seqan' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'lint'
    container:
      image: ghcr.io/seqan/gcc-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup cache
        uses: seqan/actions/setup-actions-cache@main

      - name: Install Python
        run: |
          apt-get update 1>/dev/null
          apt-get install --yes --no-install-recommends \
            python3-dev \
            python3-venv \
            1>/dev/null
          python3 -m venv "${VENV}"
          "${VENV}/bin/pip" install build

      # Builds the sdist, then the wheel from the sdist. Fails if the sdist lacks files needed for building.
      - name: Build sdist and wheel
        run: |
          "${VENV}/bin/python" -m build --outdir dist .

      - name: Install wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          "${VENV}/bin/pip" install "${WHEEL}[test]"

      - name: Run tests
        run: |
          "${VENV}/bin/pytest" -v
