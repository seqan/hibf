# Check only. If formatting is needed, this job fails, the CI run ends early (later stages are skipped), and
# lint_autofix.yml pushes the formatting commit, which starts a new CI run.

name: Lint

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash -Eeuxo pipefail {0}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # locked via actions.lock
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Format
        uses: seqan/actions/lint@main
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}

      - name: Check
        run: |
          if ! git diff --quiet; then
            { echo '### Formatting required'; echo '```diff'; git diff; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::Formatting required. The bot pushes a fix if the PR allows edits by maintainers."
            exit 1
          fi
